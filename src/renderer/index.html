<!doctype html>
<html lang="tr" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Hiper Vesika</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex flex-column vh-100 bg-body-tertiary">
    <nav class="navbar navbar-expand bg-body border-bottom flex-shrink-0">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Hiper Vesika</span>
        <span class="navbar-text small text-body-secondary d-none d-md-inline">
          Vesikalık hazırlama ve dizdirme
        </span>
      </div>
    </nav>

    <main class="flex-grow-1 overflow-auto">
      <div class="container-fluid h-100 py-3">
        <div class="row g-3 h-100">
          <!-- Çalışma alanı: dar ekranda tam genişlik, geniş ekranda solda -->
          <section class="col-12 col-lg-8 col-xxl-9 d-flex">
            <div id="calisma-alani" class="drop-zone card border-2 border-dashed w-100">
              <div
                class="card-body d-flex flex-column align-items-center justify-content-center text-center"
              >
                <p class="fs-5 mb-1">Fotoğrafı buraya sürükleyip bırakın</p>
                <p class="text-body-secondary mb-0">
                  Fotoğraf yükleme Faz 1'de etkinleşecek.
                </p>
              </div>
            </div>
          </section>

          <!-- Ayar paneli: dar ekranda altta, geniş ekranda sağda -->
          <aside class="col-12 col-lg-4 col-xxl-3">
            <div class="card h-100">
              <div class="card-header fw-semibold">Ayarlar</div>
              <div class="card-body">
                <p class="text-body-secondary mb-0">
                  Ölçü, hizalama, rötuş ve dizme ayarları sonraki fazlarda bu panele
                  eklenecek.
                </p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="border-top bg-body flex-shrink-0">
      <div class="container-fluid d-flex justify-content-between py-1">
        <span class="small text-body-secondary">Hazır</span>
        <span id="surum-bilgisi" class="small text-body-secondary font-monospace"></span>
      </div>
    </footer>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
