name: Yayın paketleri

# Elle tetiklenir, her push'ta calismaz: paketleme dakikalarca surer ve her
# commit icin yayin uretmenin anlami yok.
#
#   GitHub -> Actions -> "Yayın paketleri" -> Run workflow
#
# Uc kosucuda paralel derler, sonra dosyalari tek bir yayina yukler.
# Yapilandirma electron-builder.yml icinde.
on:
  workflow_dispatch:
    inputs:
      etiket:
        description: 'Sürüm etiketi. Boş bırakılırsa package.json sürümünden üretilir (v1.0.0 gibi).'
        required: false
        type: string
      on_yayin:
        description: 'Ön sürüm (pre-release) olarak işaretlensin. Kararlı sürümlerde kapalı bırakın.'
        required: false
        type: boolean
        default: false
      mevcudu_degistir:
        description: 'Aynı etiketli yayın zaten varsa silinip yeniden oluşturulsun.'
        required: false
        type: boolean
        default: false

# Yayin olusturmak icin depoya yazma yetkisi gerekir.
permissions:
  contents: write

jobs:
  paketle:
    name: Paketle (${{ matrix.ad }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Biri duserse digerleri devam etsin; hangi platformun bozuldugu tek
      # kosuda gorunur.
      fail-fast: false
      matrix:
        include:
          # macOS kosucusu iki mimariyi birden uretir: Intel ve Apple Silicon.
          - os: macos-latest
            ad: macOS
            komut: paket:mac
          - os: windows-latest
            ad: Windows
            komut: paket:win
          - os: ubuntu-latest
            ad: Linux
            komut: paket:linux

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # paket:* komutlari electron-builder'i `--publish never` ile cagirir.
      # Sart: electron-builder CI ortamini gorunce kendiliginden GitHub'a
      # yayinlamaya kalkiyor ve GH_TOKEN olmadigi icin paketleri urettikten
      # sonra dusuyordu. Yayini bu is akisi kendi yapiyor (asagidaki is),
      # boylece etiket, on yayin isareti ve surum notu bizde kaliyor.
      - name: Paketi üret
        run: npm run ${{ matrix.komut }}
        env:
          # macOS: anahtar zincirinde imza sertifikasi aranmasin. Sertifikamiz
          # yok; imza afterPack kancasinda ad-hoc atiliyor
          # (scripts/paket/imza.js).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Yalnizca kurulum dosyalari; release/ altindaki blockmap ve
      # latest*.yml (otomatik guncelleme meta verisi) disarida kalir.
      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  yayinla:
    name: Yayını oluştur
    needs: paketle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true

      - name: Etiketi belirle
        id: etiket
        env:
          GIRILEN: ${{ inputs.etiket }}
        run: |
          set -euo pipefail
          etiket="$GIRILEN"
          if [ -z "$etiket" ]; then
            etiket="v$(node -p "require('./package.json').version")"
          fi
          echo "deger=$etiket" >> "$GITHUB_OUTPUT"
          echo "Etiket: $etiket"

      - name: Dosyaları listele
        run: ls -lh paketler

      - name: Yayını oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ steps.etiket.outputs.deger }}
          DEGISTIR: ${{ inputs.mevcudu_degistir }}
          ON_YAYIN: ${{ inputs.on_yayin }}
        run: |
          set -euo pipefail

          if gh release view "$ETIKET" >/dev/null 2>&1; then
            if [ "$DEGISTIR" = "true" ]; then
              echo "'$ETIKET' zaten var, siliniyor."
              gh release delete "$ETIKET" --yes --cleanup-tag
            else
              echo "::error::'$ETIKET' etiketli bir yayın zaten var. Başka bir etiket verin ya da 'mevcudu değiştir' seçeneğini işaretleyip yeniden çalıştırın."
              exit 1
            fi
          fi

          # Girisi ilk paragraf ayirir; gerisi iki durumda da ayni.
          if [ "$ON_YAYIN" = "true" ]; then
            cat > notlar.md <<'NOTLAR'
          Bu bir **ön sürümdür**: denemek içindir, kararlı sürüm değildir.
          NOTLAR
          else
            cat > notlar.md <<'NOTLAR'
          Vesikalık fotoğraf hazırlama ve baskı kağıdına dizme uygulaması. Bir portre
          fotoğrafını biyometrik ölçülere göre hizalar, arka planını beyazlatır, rötuşlar ve
          istenen fiziksel ölçüde çıktı üretir — tek fotoğraf olarak ya da bir baskı kağıdına
          dizilmiş halde.
          NOTLAR
          fi

          cat >> notlar.md <<'NOTLAR'

          ### Hangi dosyayı indirmeliyim?

          | Dosya | Nerede çalışır |
          | --- | --- |
          | `…-mac-arm64.dmg` | Apple Silicon Mac (M1, M2, M3, M4) |
          | `…-mac-x64.dmg` | Intel işlemcili Mac |
          | `…-windows-x64-kurulum.exe` | Windows 10 / 11 (64 bit) |
          | `…-linux-x86_64.AppImage` | Linux (64 bit) |

          Mac'inizin hangisi olduğunu bilmiyorsanız: Apple menüsü → *Bu Mac Hakkında*.
          "Yonga: Apple M…" yazıyorsa arm64, "İşlemci: Intel…" yazıyorsa x64.

          ### İlk açılış

          Paketler imzalı değil (kod imzalama sertifikası henüz alınmadı), bu yüzden
          işletim sistemi bir kez uyarır. Bu uyarı bir hata değildir:

          - **macOS** — uygulamayı *Programlar*'a sürükleyin, sonra simgeye **sağ tık →
            Aç**, çıkan uyarıda yine **Aç**. Sonraki açılışlarda sorulmaz.
          - **Windows** — SmartScreen uyarısında **Daha fazla bilgi → Yine de çalıştır**.
          - **Linux** — indirdikten sonra çalıştırma izni verin:
            `chmod +x hiper-vesika-*.AppImage`

          ### Neler var

          Fotoğraf alma, otomatik hizalama, arka plan beyazlatma, rötuş, dışa aktarma,
          baskı kağıdına dizme ve yazdırma. Arayüz iki modda kullanılabilir: adım adım
          ilerleten **Basit** ve her ayarın açık olduğu **Gelişmiş**; ilk açılışta hangisiyle
          çalışacağınız sorulur, seçim *Görünüm* menüsünden her zaman değiştirilebilir.

          Baskı, sistemin yazdırma panelinden geçebileceği gibi **doğrudan yazıcıya** da
          gönderilebilir: panel hiç açılmaz, yazıcı ve kopya uygulamada seçilir, ölçek
          %100'de sabit kalır. Yazıcının kağıdı bir farkla basma ihtimaline karşı **ölçü
          kalibrasyonu** vardır: bir kalibrasyon sayfası basılır, cetvelle ölçtüğünüz
          değerler girilir ve düzeltme o yazıcı için saklanır. CMYK ayrımı, matbaanızın
          ICC profilini seçtiğinizde o profile göre yapılır.

          Tüm görüntü işleme bilgisayarınızda yapılır: fotoğraflar hiçbir sunucuya
          gönderilmez, uygulama internet bağlantısı kurmaz.
          NOTLAR

          printf '\n---\n\nDerleme: `%s`\n' "${GITHUB_SHA:0:7}" >> notlar.md

          bayraklar=(--title "Hiper Vesika $ETIKET" --notes-file notlar.md --target "$GITHUB_SHA")
          # `[ ... ] && ...` yazilamaz: kosul tutmayinca birlesik komut sifirdan
          # farkli doner ve `set -e` betigi orada keser.
          if [ "$ON_YAYIN" = "true" ]; then
            bayraklar+=(--prerelease)
          fi

          gh release create "$ETIKET" "${bayraklar[@]}" paketler/*
